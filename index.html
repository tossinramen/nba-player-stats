<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Prop Board</title>
<style>
  :root {
    --bg: #0d0e11; --panel: #15171c; --panel2: #1b1e24; --line: #262a32; --text: #e7e9ee;
    --muted: #8a909b; --accent: #8b5cf6; --accent-dim: #3b2d63;
    --g3: #17803d; --g2: #2c9a4e; --g1: #46a862; --r1: #c9434c; --r2: #a72a35;
    --gold: #b8901c; --none: #23262d; --pos: #4fd17a; --neg: #f0626b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 7px 12px; font-weight: 700; font-size: 12px; letter-spacing: .04em; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .field { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 200px; }
  .dd { position: relative; }
  .dd > button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 30px 4px 10px; min-width: 190px; text-align: left; cursor: pointer; position: relative; }
  .dd > button small { display: block; font-size: 10px; color: var(--muted); }
  .dd > button::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .menu { display: none; position: absolute; top: calc(100% + 4px); left: 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px; min-width: 240px; max-height: 60vh; overflow: auto; z-index: 30; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .dd.open .menu { display: block; }
  .menu label { display: flex; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .menu label:hover { background: var(--line); }
  .menu label small { color: var(--muted); margin-left: auto; padding-left: 10px; }
  .menu .grp { font-size: 11px; color: var(--muted); padding: 8px 6px 2px; display: flex; justify-content: space-between; }
  .menu .acts { display: flex; gap: 6px; padding: 2px 4px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 4px; font-size: 12px; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { display: none; }
  .toggle i { width: 30px; height: 16px; border-radius: 8px; background: var(--line); position: relative; transition: .15s; }
  .toggle i::after { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); top: 2px; left: 2px; transition: .15s; }
  .toggle input:checked + i { background: var(--accent-dim); }
  .toggle input:checked + i::after { left: 16px; background: var(--accent); }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: 16px; align-items: center; padding: 8px 16px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .05em; flex-wrap: wrap; }
  .tools > button, .tools .dd > button { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 4px 0; min-width: 0; }
  .tools .dd > button::after { content: ""; }
  .tools button.on { color: #fff; }
  .tools .meta { margin-left: auto; color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .wrap { overflow: auto; margin: 0 16px; border: 1px solid var(--line); border-radius: 8px; max-height: calc(100vh - 170px); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--text); font-weight: 600; font-size: 12px; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; z-index: 5; }
  th.nosort { cursor: default; }
  th .arr { color: var(--accent); margin-left: 3px; }
  td { padding: 0 8px; height: 46px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: center; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover td:not(.heat):not(.mu) { background: #181b21; }
  tbody tr.row.open td:not(.heat):not(.mu) { background: #1c1f26; }
  td.l { text-align: left; }
  .player { display: flex; align-items: center; gap: 8px; }
  .player img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--panel2); }
  .heart { background: none; border: 0; cursor: pointer; font-size: 17px; color: var(--muted); }
  .heart.on { color: #f0626b; }
  .tag { font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 3px; margin-left: 5px; vertical-align: 1px; }
  .tag.alt { background: var(--accent-dim); color: #c9b6ff; }
  .tag.model { background: #2b3038; color: var(--muted); }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .dim { color: var(--muted); }
  .proj small { margin-left: 4px; }
  .odds { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px 3px 8px; background: var(--panel2); cursor: pointer; position: relative; }
  .odds b { min-width: 36px; }
  .odds .bk { font-size: 9px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
  .odds::before { content: "Markets"; position: absolute; top: -8px; left: 6px; font-size: 9px; color: var(--muted); background: var(--panel); padding: 0 3px; }
  td.heat, td.mu { color: #fff; border-left: 1px solid rgba(0,0,0,.25); min-width: 70px; }
  td.heat b, td.mu b { display: block; font-size: 13px; }
  td.heat small, td.mu small { display: block; font-size: 11px; opacity: .85; }
  .ring text { fill: var(--text); font-size: 11px; font-weight: 600; }
  .pop { position: fixed; z-index: 50; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-width: 220px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .pop table td { height: 28px; text-align: left; border: 0; padding: 0 8px; }
  .pop .best { color: var(--pos); font-weight: 700; }
  tr.detail td { height: auto; padding: 14px 16px; background: #111317; text-align: left; white-space: normal; }
  .detail-head { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; color: var(--muted); }
  .detail-head b { color: var(--text); }
  .detail-head input { width: 70px; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
  .chart text { fill: var(--muted); font-size: 10px; }
  .chart .val { fill: var(--text); font-size: 10px; font-weight: 600; }
  .pager { display: flex; justify-content: flex-end; align-items: center; gap: 14px; padding: 10px 16px; color: var(--muted); }
  .pager select { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
  .pager button { background: none; border: 1px solid var(--line); border-radius: 5px; padding: 3px 10px; cursor: pointer; }
  .pager button:disabled { opacity: .35; cursor: default; }
  .empty { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 15px; }
  .empty code { background: var(--panel2); padding: 2px 6px; border-radius: 4px; color: var(--text); }
  @media (max-width: 700px) {
    .bar { padding: 10px; } .field, .dd > button { min-width: 0; width: 100%; } .dd { flex: 1 1 45%; }
    .wrap { margin: 0 8px; } .tools { padding: 8px; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="seg" id="side"><button data-side="over" class="on">OVER</button><button data-side="under">UNDER</button></div>
  <input id="search" class="field" placeholder="Search Player" autocomplete="off">
  <div class="dd" id="ddCats"><button type="button"><small>Categories</small><span></span></button><div class="menu"></div></div>
  <div class="dd" id="ddGames"><button type="button"><small>Games</small><span></span></button><div class="menu"></div></div>
  <label class="toggle"><input type="checkbox" id="alt"><i></i>Show Alt Lines</label>
  <label class="toggle" title="Add every rostered player in the selected games, using a model line where no book has one"><input type="checkbox" id="all"><i></i>All Players</label>
  <span class="count" id="count"></span>
</header>
<div class="tools">
  <div class="dd" id="ddCols"><button type="button">▥ COLUMNS</button><div class="menu"></div></div>
  <button type="button" id="export">⤓ EXPORT</button>
  <button type="button" id="favOnly">♥ FAVORITES</button>
  <span class="meta" id="meta"></span>
</div>
<div class="wrap"><table id="grid"><thead></thead><tbody></tbody></table></div>
<footer class="pager">
  <label>Rows per page: <select id="per"><option>50</option><option>100</option><option>250</option><option>500</option></select></label>
  <span id="range"></span>
  <button type="button" id="prev">‹</button><button type="button" id="next">›</button>
</footer>

<script src="data/board.js"></script>
<script>
"use strict";
const B = window.BOARD;
if (!B) {
  document.body.innerHTML = '<div class="empty">No data yet. Run <code>python update.py</code> in this folder, then reload.</div>';
  throw new Error("data/board.js missing");
}

// ---------- helpers
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();
const store = {
  get(k, d) { try { const v = localStorage.getItem("nbaprops." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("nbaprops." + k, JSON.stringify(v)); } catch {} },
};
const fmtOdds = n => n == null ? "—" : (n > 0 ? "+" + n : String(n));
const fmt1 = n => n == null ? "—" : (Math.round(n * 10) / 10).toFixed(1);
const BOOKS = { FD: "FanDuel", UD: "Underdog" };
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const dateLabel = d => { const [y, m, dd] = d.split("-").map(Number); return `${DOW[new Date(y, m - 1, dd).getDay()]} ${m}/${dd}`; };

// ---------- data access
// Log rows: [date, opp, home, seasonIdx, typeIdx, wl, ...stat_fields]
const I = {}; B.meta.stat_fields.forEach((f, i) => I[f] = i + 6);
const CUR = B.meta.seasons.length - 1, LAST = CUR - 1;
const dcount = g => (g[I.pts] >= 10) + (g[I.reb] >= 10) + (g[I.ast] >= 10) + (g[I.stl] >= 10) + (g[I.blk] >= 10);
const CATF = {
  pts: g => g[I.pts], reb: g => g[I.reb], ast: g => g[I.ast], fg3m: g => g[I.fg3m],
  stl: g => g[I.stl], blk: g => g[I.blk], tov: g => g[I.tov],
  pra: g => g[I.pts] + g[I.reb] + g[I.ast], pr: g => g[I.pts] + g[I.reb],
  pa: g => g[I.pts] + g[I.ast], ra: g => g[I.reb] + g[I.ast], stocks: g => g[I.stl] + g[I.blk],
  fgm: g => g[I.fgm], fga: g => g[I.fga], fg3a: g => g[I.fg3a], ftm: g => g[I.ftm],
  dd: g => dcount(g) >= 2 ? 1 : 0, td: g => dcount(g) >= 3 ? 1 : 0,
};
const CATS = B.meta.categories;
const GAMES = Object.fromEntries(B.games.map(g => [g.id, g]));
const NAMEN = Object.fromEntries(Object.entries(B.players).map(([id, p]) => [id, norm(p.n)]));
const VC = new Map();
function values(pid, cat) {
  const k = pid + "|" + cat;
  if (!VC.has(k)) VC.set(k, (B.logs[pid] || []).map(CATF[cat]));
  return VC.get(k);
}
function recentMean(v) { // recency-weighted mean of the last 30 games
  let w = 1, sw = 0, s = 0;
  for (let i = 0; i < Math.min(v.length, 30); i++) { s += v[i] * w; sw += w; w *= 0.9; }
  return sw ? s / sw : null;
}

const BOOK_ROWS = B.props.map(p => ({ ...p, key: `${p.pid}|${p.cat}|${p.line}|${p.game}`, model: false }));
const MAIN = new Set(BOOK_ROWS.filter(r => r.main).map(r => `${r.pid}|${r.cat}|${r.game}`));

// ---------- state
const firstDate = (B.games.find(g => g.date >= B.meta.today) || B.games[0] || {}).date;
const state = {
  side: "over", q: "", alt: false, all: BOOK_ROWS.length === 0, fav: false,
  cats: new Set(store.get("cats", Object.keys(CATS)).filter(c => c in CATS)),
  games: new Set(B.games.filter(g => g.date === firstDate).map(g => g.id)),
  sort: { k: "score", dir: -1 }, page: 0, per: store.get("per", 100), open: null,
};
const favs = new Set(store.get("favs", []));
const custom = new Map(); // row key -> user-entered line
const favKey = r => r.pid + "|" + r.cat;

// ---------- model rows (players with no book line)
function modelRows() {
  const byTeam = new Map();
  for (const g of B.games) {
    if (!state.games.has(g.id)) continue;
    for (const [t, o] of [[g.home, g.away], [g.away, g.home]]) {
      if (!byTeam.has(t)) byTeam.set(t, []);
      byTeam.get(t).push([g.id, o]);
    }
  }
  const out = [];
  for (const [pid, p] of Object.entries(B.players)) {
    const slots = B.games.length ? byTeam.get(p.t) : [["", ""]];
    if (!slots) continue;
    for (const [gid, opp] of slots) for (const cat of state.cats) {
      if (MAIN.has(`${pid}|${cat}|${gid}`)) continue;
      const v = values(pid, cat);
      if (!v.length) continue;
      const line = (cat === "dd" || cat === "td") ? 0.5 : Math.floor(recentMean(v)) + 0.5;
      out.push({ pid, cat, line, game: gid, opp, main: true, books: [], model: true, key: `${pid}|${cat}|${line}|${gid}|m` });
    }
  }
  return out;
}

// ---------- per-row stats
function calc(r) {
  const P = B.players[r.pid], logs = B.logs[r.pid] || [], v = values(r.pid, r.cat);
  const L = custom.has(r.key) ? custom.get(r.key) : r.line;
  const over = state.side === "over";
  const hit = over ? x => x > L : x => x < L;
  const agg = (keep, limit) => {
    let h = 0, n = 0;
    for (let i = 0; i < logs.length && (limit == null || n < limit); i++) {
      if (keep && !keep(logs[i])) continue;
      n++; if (hit(v[i])) h++;
    }
    return { h, n, p: n ? h / n : null };
  };
  const c = {
    L,
    sLast: LAST >= 0 ? agg(g => g[3] === LAST) : { h: 0, n: 0, p: null },
    sCur: agg(g => g[3] === CUR),
    h2h: r.opp ? agg(g => g[1] === r.opp) : { h: 0, n: 0, p: null },
    l5: agg(null, 5), l10: agg(null, 10), l20: agg(null, 20),
  };
  let streak = 0; for (const x of v) { if (hit(x)) streak++; else break; }
  c.streak = streak;
  const avg = k => { const s = v.slice(0, k); return s.length ? s.reduce((a, b) => a + b, 0) / s.length : null; };
  c.l5avg = avg(5); c.l10avg = avg(10);

  // Projection: recency-weighted average nudged by how much this opponent allows to the position.
  const d = r.opp && P.g ? B.defense[r.opp]?.[P.g]?.[r.cat] : null;
  const lg = P.g ? B.league[P.g]?.[r.cat] : null;
  c.rank = d ? d[0] : null; c.allowed = d ? d[1] : null;
  let proj = recentMean(v);
  if (proj != null && d && lg) proj *= 1 + (Math.min(1.15, Math.max(0.85, d[1] / lg)) - 1) * 0.5;
  c.proj = proj;

  // Best price for the chosen side.
  let best = null;
  for (const b of r.books) { const o = over ? b.o : b.u; if (o != null && (best == null || o > best.o)) best = { o, b: b.b }; }
  c.best = best;

  // Score 0-100: weighted hit rates (shrunk for small samples) + matchup + projection edge.
  const parts = [[c.sLast, .10, 10], [c.sCur, .15, 10], [c.h2h, .10, 3], [c.l5, .20, 5], [c.l10, .20, 10], [c.l20, .15, 20]];
  let s = 0, w = 0;
  for (const [a, wt, full] of parts) if (a.n) { const ww = wt * Math.min(1, a.n / full); s += a.p * ww; w += ww; }
  if (c.rank) { const m = (c.rank - 1) / 29; s += (over ? m : 1 - m) * .10; w += .10; }
  if (proj != null) { const e = (proj - L) / Math.max(1, L) * (over ? 1 : -1); s += Math.min(1, Math.max(0, .5 + e)) * .10; w += .10; }
  c.score = w ? Math.round(100 * s / w) : null;
  r.c = c;
  return r;
}

// ---------- cell renderers
const heatColor = p => p == null ? "var(--none)" : p >= .8 ? "var(--g3)" : p >= .6 ? "var(--g2)" : p >= .5 ? "var(--g1)" : p >= .4 ? "var(--r1)" : "var(--r2)";
const heat = a => `<td class="heat" style="background:${heatColor(a.p)}">${a.n ? `<b>${Math.round(a.p * 100)}%</b><small>${a.h}/${a.n}</small>` : `<b class="dim">—</b>`}</td>`;
function ring(score) {
  if (score == null) return "—";
  const col = score >= 70 ? "#3fbf68" : score >= 60 ? "#e0b030" : "#d0505a";
  return `<svg class="ring" width="32" height="32" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#2a2e37" stroke-width="3"/>
    <circle cx="18" cy="18" r="15" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${score / 100 * 94.25} 94.25" transform="rotate(-90 18 18)"/>
    <text x="18" y="22" text-anchor="middle">${score}</text></svg>`;
}
function matchup(r) {
  const c = r.c, over = state.side === "over";
  if (!r.opp) return `<td class="mu" style="background:var(--none)"><b class="dim">—</b></td>`;
  const g = GAMES[r.game], at = g && g.home === r.opp ? "@ " : "vs ";
  let bg = "var(--none)";
  if (c.rank) { const good = over ? c.rank >= 21 : c.rank <= 10, bad = over ? c.rank <= 10 : c.rank >= 21; bg = good ? "var(--g2)" : bad ? "var(--r1)" : "var(--gold)"; }
  const P = B.players[r.pid];
  const tip = c.rank ? `${r.opp} allows ${c.allowed} ${CATS[r.cat]} per game to ${{ G: "guards", F: "forwards", C: "centers" }[P.g]} (rank ${c.rank}/30, 30 = most allowed)` : "";
  return `<td class="mu" style="background:${bg}" title="${esc(tip)}"><b>${at}${r.opp}</b><small>${c.rank ? "Rank " + c.rank : ""}</small></td>`;
}
const sideChar = () => state.side === "over" ? "o" : "u";
const lineCls = (x, L) => x == null ? "dim" : (state.side === "over" ? x > L : x < L) ? "pos" : "neg";

const COLS = [
  { k: "fav", l: "", nosort: true, r: r => `<td><button class="heart${favs.has(favKey(r)) ? " on" : ""}" data-act="fav" title="Favorite">${favs.has(favKey(r)) ? "♥" : "♡"}</button></td>` },
  { k: "score", l: "Score", s: r => r.c.score, r: r => `<td>${ring(r.c.score)}</td>`, csv: r => r.c.score },
  { k: "team", l: "Team", s: r => B.players[r.pid].t, r: r => `<td>${B.players[r.pid].t}</td>`, csv: r => B.players[r.pid].t },
  { k: "pos", l: "Pos", s: r => B.players[r.pid].p, r: r => `<td>${esc(B.players[r.pid].p)}</td>`, csv: r => B.players[r.pid].p },
  { k: "exp", l: "Exp", title: "Years in the NBA (R = rookie)", s: r => B.players[r.pid].x, r: r => `<td>${B.players[r.pid].x || "R"}</td>`, csv: r => B.players[r.pid].x || "R" },
  { k: "player", l: "Player", s: r => B.players[r.pid].n, csv: r => B.players[r.pid].n,
    r: r => { const p = B.players[r.pid]; return `<td class="l"><div class="player">${p.img ? `<img src="${p.img}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">` : ""}<span>${esc(p.n)}</span></div></td>`; } },
  { k: "prop", l: "Prop", s: r => CATS[r.cat] + r.c.L, csv: r => `${sideChar()}${r.c.L} ${CATS[r.cat]}`,
    r: r => `<td class="l">${sideChar()}${r.c.L} ${CATS[r.cat]}${r.model ? '<span class="tag model" title="No book line: line = recent average rounded">MODEL</span>' : !r.main ? '<span class="tag alt">ALT</span>' : ""}${custom.has(r.key) ? '<span class="tag alt">CUSTOM</span>' : ""}</td>` },
  { k: "l10avg", l: "L10 Avg", s: r => r.c.l10avg, r: r => `<td class="${lineCls(r.c.l10avg, r.c.L)}">${fmt1(r.c.l10avg)}</td>`, csv: r => fmt1(r.c.l10avg) },
  { k: "l5avg", l: "L5 Avg", s: r => r.c.l5avg, r: r => `<td class="${lineCls(r.c.l5avg, r.c.L)}">${fmt1(r.c.l5avg)}</td>`, csv: r => fmt1(r.c.l5avg) },
  { k: "proj", l: "Projection", s: r => r.c.proj == null ? null : r.c.proj - r.c.L, csv: r => fmt1(r.c.proj),
    r: r => { const p = r.c.proj; if (p == null) return "<td class='dim'>—</td>"; const d = p - r.c.L; return `<td class="proj">${fmt1(p)}<small class="${lineCls(p, r.c.L)}">${d >= 0 ? "+" : ""}${fmt1(d)}</small></td>`; } },
  { k: "odds", l: "Odds", s: r => r.c.best?.o, csv: r => r.c.best ? `${fmtOdds(r.c.best.o)} ${r.c.best.b}` : "",
    r: r => r.books.length ? `<td><span class="odds" data-act="mk"><b>${fmtOdds(r.c.best?.o)}</b><span class="bk">${r.c.best ? r.c.best.b : r.books[0].b}</span>▾</span></td>` : `<td class="dim">—</td>` },
  { k: "streak", l: "Streak", s: r => r.c.streak, r: r => `<td>${r.c.streak}</td>`, csv: r => r.c.streak },
  { k: "matchup", l: "Matchup", s: r => r.c.rank == null ? null : (state.side === "over" ? r.c.rank : 31 - r.c.rank), r: matchup, csv: r => `${r.opp} ${r.c.rank ?? ""}` },
  ...(LAST >= 0 ? [{ k: "sLast", l: B.meta.seasons[LAST], s: r => r.c.sLast.p, r: r => heat(r.c.sLast), csv: r => pctCsv(r.c.sLast) }] : []),
  { k: "sCur", l: B.meta.seasons[CUR], s: r => r.c.sCur.p, r: r => heat(r.c.sCur), csv: r => pctCsv(r.c.sCur) },
  { k: "h2h", l: "H2H", s: r => r.c.h2h.p, r: r => heat(r.c.h2h), csv: r => pctCsv(r.c.h2h) },
  { k: "l5", l: "L5", s: r => r.c.l5.p, r: r => heat(r.c.l5), csv: r => pctCsv(r.c.l5) },
  { k: "l10", l: "L10", s: r => r.c.l10.p, r: r => heat(r.c.l10), csv: r => pctCsv(r.c.l10) },
  { k: "l20", l: "L20", s: r => r.c.l20.p, r: r => heat(r.c.l20), csv: r => pctCsv(r.c.l20) },
  { k: "game", l: "Game", hidden: true, s: r => GAMES[r.game]?.tipoff, csv: r => gameText(r.game),
    r: r => `<td class="dim">${esc(gameText(r.game))}</td>` },
];
function pctCsv(a) { return a.n ? `${Math.round(a.p * 100)}% (${a.h}/${a.n})` : ""; }
function gameText(id) { const g = GAMES[id]; return g ? `${g.away} @ ${g.home} ${dateLabel(g.date)} ${g.time}` : ""; }
let visible = new Set(store.get("cols", COLS.filter(c => !c.hidden).map(c => c.k)));
const shownCols = () => COLS.filter(c => visible.has(c.k));

// ---------- build + render
let current = [];
function compute() {
  const noGames = B.games.length === 0;
  let rows = BOOK_ROWS.filter(r => (state.alt || r.main) && state.cats.has(r.cat) && (noGames || state.games.has(r.game)));
  if (state.all) rows = rows.concat(modelRows());
  const q = norm(state.q.trim());
  if (q) rows = rows.filter(r => NAMEN[r.pid].includes(q));
  if (state.fav) rows = rows.filter(r => favs.has(favKey(r)));
  rows.forEach(calc);
  // Over-only markets (alt ladders, FanDuel DD/TD) can't be bet as unders, and vice versa.
  rows = rows.filter(r => r.model || r.c.best);
  const col = COLS.find(c => c.k === state.sort.k) || COLS[1], dir = state.sort.dir;
  rows.sort((a, b) => {
    const x = col.s(a), y = col.s(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * dir;
  });
  current = rows;
}

function render() {
  const cols = shownCols();
  $("#grid thead").innerHTML = "<tr>" + cols.map(c =>
    `<th data-k="${c.k}" class="${c.nosort ? "nosort" : ""}" title="${esc(c.title || "")}">${esc(c.l)}${state.sort.k === c.k ? `<span class="arr">${state.sort.dir < 0 ? "↓" : "↑"}</span>` : ""}</th>`).join("") + "</tr>";
  const pages = Math.max(1, Math.ceil(current.length / state.per));
  state.page = Math.min(state.page, pages - 1);
  const start = state.page * state.per, slice = current.slice(start, start + state.per);
  $("#grid tbody").innerHTML = slice.map((r, i) => {
    const html = `<tr class="row${state.open === r.key ? " open" : ""}" data-i="${start + i}">${cols.map(c => c.r(r)).join("")}</tr>`;
    return state.open === r.key ? html + detail(r, cols.length) : html;
  }).join("") || `<tr><td colspan="${cols.length}" class="empty">No props match these filters.${B.games.length && !state.games.size ? " Pick a game." : ""}</td></tr>`;
  $("#count").textContent = `${current.length}/${BOOK_ROWS.length}`;
  $("#range").textContent = current.length ? `${start + 1}–${Math.min(start + state.per, current.length)} of ${current.length}` : "0 of 0";
  $("#prev").disabled = state.page === 0;
  $("#next").disabled = state.page >= pages - 1;
}
const refresh = () => { compute(); render(); };

// ---------- expanded row: game-by-game chart + custom line
function detail(r, span) {
  const logs = (B.logs[r.pid] || []).slice(0, 20).reverse(), v = values(r.pid, r.cat).slice(0, 20).reverse();
  const L = r.c.L, P = B.players[r.pid];
  const W = Math.max(520, logs.length * 38), H = 170, top = 18, bottom = 34, bw = 26;
  const max = Math.max(L * 1.25, ...v, 1);
  const y = x => top + (H - top - bottom) * (1 - x / max);
  const bars = v.map((x, i) => {
    const g = logs[i], cx = 20 + i * ((W - 40) / Math.max(1, v.length)), hitb = state.side === "over" ? x > L : x < L;
    const yy = y(x), h = H - bottom - yy;
    return `<rect x="${cx}" y="${yy}" width="${bw}" height="${Math.max(1, h)}" rx="3" fill="${hitb ? "#2c9a4e" : "#c9434c"}"><title>${g[0]} ${g[2] ? "vs" : "@"} ${g[1]}: ${x} (${g[I.min]} min)</title></rect>
      <text class="val" x="${cx + bw / 2}" y="${yy - 4}" text-anchor="middle">${x}</text>
      <text x="${cx + bw / 2}" y="${H - bottom + 13}" text-anchor="middle">${g[1]}</text>
      <text x="${cx + bw / 2}" y="${H - bottom + 25}" text-anchor="middle">${+g[0].slice(5, 7)}/${+g[0].slice(8)}</text>`;
  }).join("");
  const seasonAvg = idx => { const s = (B.logs[r.pid] || []).map((g, i) => [g, values(r.pid, r.cat)[i]]).filter(([g]) => g[3] === idx); return s.length ? `${fmt1(s.reduce((a, [, x]) => a + x, 0) / s.length)} avg · ${s.length} gp` : "no games"; };
  const books = r.books.map(b => `${BOOKS[b.b] || b.b} ${fmtOdds(b.o)}/${fmtOdds(b.u)}`).join(" · ");
  return `<tr class="detail"><td colspan="${span}">
    <div class="detail-head">
      <span><b>${esc(P.n)}</b> · ${P.t} · ${esc(P.p)} · ${P.x ? P.x + " yrs" : "Rookie"}</span>
      ${LAST >= 0 ? `<span>${B.meta.seasons[LAST]}: <b>${seasonAvg(LAST)}</b></span>` : ""}
      <span>${B.meta.seasons[CUR]}: <b>${seasonAvg(CUR)}</b></span>
      ${books ? `<span>${books}</span>` : ""}
      <label>Line <input type="number" step="0.5" value="${L}" data-act="line"></label>
      ${custom.has(r.key) ? `<button class="linkbtn" data-act="reset">reset to ${r.line}</button>` : ""}
    </div>
    ${v.length ? `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
      ${bars}<line x1="10" x2="${W - 10}" y1="${y(L)}" y2="${y(L)}" stroke="#e7e9ee" stroke-dasharray="4 4" opacity=".7"/>
      <text x="${W - 12}" y="${y(L) - 4}" text-anchor="end">${L}</text></svg>` : `<div class="dim">No NBA games logged yet.</div>`}
  </td></tr>`;
}

// ---------- markets popover
let pop = null;
function closePop() { if (pop) { pop.remove(); pop = null; } }
function openMarkets(r, el) {
  closePop();
  const over = state.side === "over";
  pop = document.createElement("div");
  pop.className = "pop";
  pop.innerHTML = `<table>${r.books.map(b => {
    const o = over ? b.o : b.u;
    return `<tr><td>${BOOKS[b.b] || b.b}</td><td>${sideChar()}${r.line}</td><td class="${r.c.best && r.c.best.b === b.b ? "best" : ""}">${fmtOdds(o)}</td><td class="dim">${over ? "u" : "o"} ${fmtOdds(over ? b.u : b.o)}</td></tr>`;
  }).join("")}</table>`;
  document.body.appendChild(pop);
  const rc = el.getBoundingClientRect();
  pop.style.left = Math.min(rc.left, innerWidth - pop.offsetWidth - 8) + "px";
  pop.style.top = (rc.bottom + 4) + "px";
}

// ---------- dropdown menus
function setupDD(id, build, label) {
  const dd = $(id), menu = dd.querySelector(".menu");
  dd.querySelector("button").addEventListener("click", e => {
    e.stopPropagation();
    document.querySelectorAll(".dd.open").forEach(x => x !== dd && x.classList.remove("open"));
    dd.classList.toggle("open");
  });
  menu.addEventListener("click", e => e.stopPropagation());
  const paint = () => { menu.innerHTML = build(); if (label) dd.querySelector("button span").textContent = label(); };
  paint();
  return paint;
}
const paintCats = setupDD("#ddCats", () =>
  `<div class="acts"><button class="linkbtn" data-all="1">All</button><button class="linkbtn" data-all="0">None</button></div>` +
  Object.entries(CATS).map(([k, l]) => `<label><input type="checkbox" value="${k}" ${state.cats.has(k) ? "checked" : ""}>${l}</label>`).join(""),
  () => `${state.cats.size} selected`);
const paintGames = setupDD("#ddGames", () => {
  if (!B.games.length) return `<div class="grp">No upcoming games in the schedule.</div>`;
  let html = `<div class="acts"><button class="linkbtn" data-all="1">All</button><button class="linkbtn" data-all="0">None</button></div>`, last = "";
  for (const g of B.games) {
    if (g.date !== last) { last = g.date; html += `<div class="grp"><span>${dateLabel(g.date)}</span><button class="linkbtn" data-date="${g.date}">only this day</button></div>`; }
    html += `<label><input type="checkbox" value="${g.id}" ${state.games.has(g.id) ? "checked" : ""}>${g.away} @ ${g.home}<small>${g.time}</small></label>`;
  }
  return html;
}, () => B.games.length ? `${state.games.size} selected` : "none scheduled");
const paintCols = setupDD("#ddCols", () =>
  COLS.filter(c => c.l).map(c => `<label><input type="checkbox" value="${c.k}" ${visible.has(c.k) ? "checked" : ""}>${c.l}</label>`).join(""));

$("#ddCats .menu").addEventListener("change", e => {
  e.target.checked ? state.cats.add(e.target.value) : state.cats.delete(e.target.value);
  store.set("cats", [...state.cats]); paintCats(); state.page = 0; refresh();
});
$("#ddCats .menu").addEventListener("click", e => {
  const a = e.target.dataset.all; if (a == null) return;
  state.cats = new Set(a === "1" ? Object.keys(CATS) : []);
  store.set("cats", [...state.cats]); paintCats(); state.page = 0; refresh();
});
$("#ddGames .menu").addEventListener("change", e => {
  e.target.checked ? state.games.add(e.target.value) : state.games.delete(e.target.value);
  paintGames(); state.page = 0; refresh();
});
$("#ddGames .menu").addEventListener("click", e => {
  const { all, date } = e.target.dataset;
  if (all != null) state.games = new Set(all === "1" ? B.games.map(g => g.id) : []);
  else if (date) state.games = new Set(B.games.filter(g => g.date === date).map(g => g.id));
  else return;
  paintGames(); state.page = 0; refresh();
});
$("#ddCols .menu").addEventListener("change", e => {
  e.target.checked ? visible.add(e.target.value) : visible.delete(e.target.value);
  store.set("cols", [...visible]); render();
});
document.addEventListener("click", () => { document.querySelectorAll(".dd.open").forEach(x => x.classList.remove("open")); closePop(); });

// ---------- other controls
$("#side").addEventListener("click", e => {
  const s = e.target.dataset.side; if (!s) return;
  state.side = s;
  document.querySelectorAll("#side button").forEach(b => b.classList.toggle("on", b.dataset.side === s));
  refresh();
});
$("#search").addEventListener("input", e => { state.q = e.target.value; state.page = 0; refresh(); });
$("#alt").addEventListener("change", e => { state.alt = e.target.checked; state.page = 0; refresh(); });
$("#all").checked = state.all;
$("#all").addEventListener("change", e => { state.all = e.target.checked; state.page = 0; refresh(); });
$("#favOnly").addEventListener("click", e => { state.fav = !state.fav; e.currentTarget.classList.toggle("on", state.fav); state.page = 0; refresh(); });
$("#per").value = String(state.per);
$("#per").addEventListener("change", e => { state.per = +e.target.value; store.set("per", state.per); state.page = 0; render(); });
$("#prev").addEventListener("click", () => { state.page--; render(); $(".wrap").scrollTop = 0; });
$("#next").addEventListener("click", () => { state.page++; render(); $(".wrap").scrollTop = 0; });

$("#grid thead").addEventListener("click", e => {
  const th = e.target.closest("th"); if (!th || th.classList.contains("nosort")) return;
  const k = th.dataset.k;
  state.sort = state.sort.k === k ? { k, dir: -state.sort.dir } : { k, dir: ["team", "pos", "player", "prop", "game"].includes(k) ? 1 : -1 };
  refresh();
});
$("#grid tbody").addEventListener("click", e => {
  const tr = e.target.closest("tr.row, tr.detail");
  if (!tr) return;
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (tr.classList.contains("detail")) {
    if (act === "reset") { custom.delete(state.open); refresh(); }
    return;
  }
  const r = current[+tr.dataset.i];
  if (act === "fav") {
    const k = favKey(r); favs.has(k) ? favs.delete(k) : favs.add(k);
    store.set("favs", [...favs]); state.fav ? refresh() : render(); return;
  }
  if (act === "mk") { e.stopPropagation(); openMarkets(r, e.target.closest(".odds")); return; }
  state.open = state.open === r.key ? null : r.key;
  render();
});
$("#grid tbody").addEventListener("change", e => {
  if (e.target.dataset.act !== "line") return;
  const x = parseFloat(e.target.value);
  if (!Number.isNaN(x)) { custom.set(state.open, x); refresh(); }
});

$("#export").addEventListener("click", () => {
  const cols = shownCols().filter(c => c.csv);
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const lines = [cols.map(c => q(c.l)).join(","), ...current.map(r => cols.map(c => q(c.csv(r))).join(","))];
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = `nba-props-${state.side}-${B.meta.today}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
});

$("#meta").textContent = `Updated ${B.meta.updated} · stats: ${B.meta.source} · ${Object.keys(B.players).length} players · books: ${[...new Set(B.props.flatMap(p => p.books.map(b => BOOKS[b.b] || b.b)))].join(", ") || "none"}`;
refresh();
</script>
</body>
</html>
